# Builds on every push and PR to main; deploys via pm2 only on a push to main.
# Brevo credentials (BREVO_API_KEY, BREVO_SENDER_EMAIL) are passed from
# repository secrets; remaining defaults live in src/config/config.ts.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# One deploy at a time. A newer push supersedes an in-flight run rather than
# racing it to restart pm2.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x
  PM2_APP_NAME: saptadinga-server

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      # Compiles src/ to dist/ and type-checks in the same pass, so a broken
      # build never reaches pm2.
      - name: Build
        run: npm run build

      # Deploy only for pushes to main — a pull request must never restart the
      # live server.
      - name: Restart server (pm2)
        if: github.event_name == 'push'
        env:
          NODE_ENV: PROD
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_EMAIL_HETALBON: ${{ secrets.BREVO_SENDER_EMAIL_HETALBON }}
          BREVO_SENDER_EMAIL_MACHRANGA: ${{ secrets.BREVO_SENDER_EMAIL_MACHRANGA }}
        run: |
          if npx pm2 describe "$PM2_APP_NAME" > /dev/null 2>&1; then
            npx pm2 restart "$PM2_APP_NAME" --update-env
          else
            npx pm2 start dist/index.js --name "$PM2_APP_NAME"
          fi
          npx pm2 save

      - name: Show process status
        if: github.event_name == 'push'
        run: npx pm2 list
